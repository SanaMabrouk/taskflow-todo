<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow To-Do</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="card-header">
      <h1>TaskFlow <span>To-Do</span></h1>
      <p class="subtitle">Plan your day, one task at a time.</p>
    </header>

    <form id="task-form" class="task-form" autocomplete="off">
      <input id="task-input" type="text" placeholder="What needs to be done?" maxlength="120" aria-label="New task">
      <button type="submit" id="add-btn">Add</button>
    </form>

    <p id="counter" class="counter">0 tasks remaining</p>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-state" class="empty-state">No tasks yet. Add your first one above!</p>

    <footer class="footer">
      <span>TaskFlow To-Do v1</span>
      <span class="pod">Served by: <strong id="hostname">loading…</strong></span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
